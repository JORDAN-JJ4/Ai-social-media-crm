<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
    <defs>
        <linearGradient id="omniGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#6366f1" />
            <stop offset="50%" stop-color="#a855f7" />
            <stop offset="100%" stop-color="#ec4899" />
        </linearGradient>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>
    <rect width="64" height="64" rx="16" fill="#0b0f19" />
    <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5" />
    <g filter="url(#glow)">
        <polygon points="32 10 10 22 32 34 54 22 32 10" fill="none" stroke="url(#omniGrad)" stroke-width="4" stroke-linejoin="round"/>
        <polyline points="10 34 32 46 54 34" fill="none" stroke="url(#omniGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <polyline points="10 46 32 58 54 46" fill="none" stroke="url(#omniGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
</svg>
